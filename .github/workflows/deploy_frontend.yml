name: Deploy Frontend

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy_frontend.yml"

  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build frontend image
        run: docker build -t blog_frontend:latest -f frontend/Dockerfile frontend/

      - name: Save image to tar
        run: docker save blog_frontend:latest > frontend.tar

      - name: Package deploy-config bundle
        run: |
          tar -czf deploy-config.tar.gz \
            compose.prod.yml \
            deploy/remote-deploy.sh \
            deploy/certbot.sh \
            deploy/nginx/http.conf.template \
            deploy/nginx/https.conf.template \
            deploy/nginx/rustfs.http.conf.template \
            deploy/nginx/rustfs.https.conf.template \
            config/backend_config.toml \
            .env.example

      - name: Upload image + config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend.tar,deploy-config.tar.gz"
          target: "~/projects/blog"
          strip_components: 0

      - name: Setup server .env
        uses: ./.github/actions/setup-env
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          env-content: ${{ secrets.SERVER_ENV }}

      - name: Load image and deploy on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: false
          script: |
            set -euo pipefail
            cd "$HOME/projects/blog"
            tar -xzf deploy-config.tar.gz
            rm -f deploy-config.tar.gz
            bash deploy/remote-deploy.sh frontend
