name: blog

services:
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: blog_rustfs
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - blog_net

  postgres:
    image: docker.io/library/postgres:latest
    container_name: blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: md5
    command: -c listen_addresses='*'
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blog_net

  redis:
    image: docker.io/library/redis:latest
    container_name: blog_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - blog_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: blog_backend
    restart: unless-stopped
    environment:
      # 配置模板里 redis.host 写死为 localhost，用环境变量覆盖为服务名
      APP_REDIS_HOST: redis
    volumes:
      - ./deploy/runtime/backend/config.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
    networks:
      - blog_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: blog_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_TELEMETRY_DISABLED: "1"
      # SSR 服务端访问后端地址
      NUXT_API_BASE: "http://backend:8000/api/v1"
      NUXT_BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    networks:
      - blog_net

  nginx:
    image: docker.io/library/nginx:latest
    container_name: blog_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./deploy/runtime/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 须挂载整个 etc（live 软链指向 archive），否则证书加载失败
      - ./deploy/letsencrypt/etc:/etc/letsencrypt:ro
      # ACME HTTP-01 挑战目录，certbot 续期写入、nginx 对外服务
      - ./deploy/acme:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - blog_net

volumes:
  rustfs_data:
  pgdata:
  redis_data:

networks:
  blog_net:
    driver: bridge
